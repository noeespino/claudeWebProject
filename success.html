<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Tee Haven</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .status-page { max-width: 560px; margin: 80px auto; padding: 48px 32px; background: var(--color-surface); border-radius: 12px; box-shadow: var(--shadow-md); text-align: center; }
    .status-page h1 { margin-bottom: 16px; letter-spacing: -0.02em; }
    .status-page p { color: var(--color-muted); margin-bottom: 12px; }
    .status-page .meta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; background: var(--color-bg); padding: 12px; border-radius: 8px; margin: 24px 0; word-break: break-all; }
    .status-icon { font-size: 3rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Tee<span>Haven</span></a>
    </div>
  </header>

  <main class="status-page">
    <div class="status-icon">✓</div>
    <h1>Thank you for your order!</h1>
    <p>Your payment was approved. We're preparing your t-shirts.</p>
    <div class="meta" id="order-meta">Loading order details…</div>
    <a href="/" class="btn btn-primary">Continue shopping</a>
  </main>

  <script>
    try { localStorage.removeItem("teehaven_cart_v1"); } catch {}
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get("payment_id");
    const status = params.get("status");
    const ref = params.get("external_reference");
    const meta = document.getElementById("order-meta");
    meta.innerHTML = `
      <div><strong>Order:</strong> ${ref || "—"}</div>
      <div><strong>Payment:</strong> ${paymentId || "—"}</div>
      <div><strong>Status:</strong> ${status || "approved"}</div>
    `;
  </script>
</body>
</html>
