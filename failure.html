<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Failed — Tee Haven</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .status-page { max-width: 560px; margin: 80px auto; padding: 48px 32px; background: var(--color-surface); border-radius: 12px; box-shadow: var(--shadow-md); text-align: center; }
    .status-page h1 { margin-bottom: 16px; letter-spacing: -0.02em; }
    .status-page p { color: var(--color-muted); margin-bottom: 24px; }
    .status-icon { font-size: 3rem; margin-bottom: 16px; color: #b3261e; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Tee<span>Haven</span></a>
    </div>
  </header>

  <main class="status-page">
    <div class="status-icon">✕</div>
    <h1>Payment didn't go through</h1>
    <p>Your card was declined or the payment was cancelled. Your cart is still saved — try again with another payment method.</p>
    <a href="/#products" class="btn btn-primary">Back to checkout</a>
  </main>
</body>
</html>
